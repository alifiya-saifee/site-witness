<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diwan sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Diwan tokens, copied from web/app.css: ink navy, sand gold, soft light */
:root{
  --bg:#0a0d13; --bg-2:#0f131c; --panel:rgba(19,24,35,.78); --panel-solid:#131823; --raise:#1a2030;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --ink:#ece8df; --muted:#8b92a3; --faint:#5d6476;
  --gold:#e8c77a; --gold-2:#f6e2ae; --gold-soft:rgba(232,199,122,.12);
  --teal:#5ccfb5; --blue:#7ea6f8; --violet:#b591f3; --green:#82d99f;
  --warn:#f0b35e; --warn-soft:rgba(240,179,94,.13); --bad:#f27d7d; --bad-soft:rgba(242,125,125,.13);
  --ai:rgba(92,207,181,.12);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Instrument Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ar:"IBM Plex Sans Arabic","Geeza Pro",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 var(--font);color:var(--ink);background:radial-gradient(1200px 520px at 15% -10%,rgba(232,199,122,.09),transparent 60%),radial-gradient(900px 480px at 100% 0%,rgba(92,207,181,.06),transparent 60%),var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
header.top{display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(10,13,19,.82);backdrop-filter:blur(14px);position:relative;z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .word{font-family:var(--display);font-size:25px;line-height:1}
.brand .tag{font-size:11px;color:var(--muted);border-left:1px solid var(--line-2);padding-left:10px;letter-spacing:.4px}
.sample{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:99px}
.mode{margin-left:auto;display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.mode button{border:0;background:transparent;padding:7px 14px;color:var(--muted);font-weight:500;font-size:13px}
.mode button[aria-pressed="true"]{background:var(--gold);color:#1b1608}

.layout{position:absolute;inset:56px 0 0 0;display:grid;grid-template-columns:440px 1fr}
@media (max-width:900px){body{overflow:auto}.layout{position:static;grid-template-columns:1fr}.stagewrap{height:420px;order:-1}}
.side{border-right:1px solid var(--line);background:rgba(12,16,24,.74);backdrop-filter:blur(14px);overflow-y:auto;padding:22px 22px 28px}
.progress{display:flex;gap:6px;margin-bottom:18px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line-2)}
.progress i.on{background:var(--gold)}
.k{font:600 11px var(--font);letter-spacing:2.2px;color:var(--gold);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.1;margin:6px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
input,select{width:100%;background:var(--bg-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:12px 14px}
.opt:hover{border-color:var(--gold)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt b{display:block;font-weight:600}
.opt span{font-size:12.5px;color:var(--muted)}
.opt .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:15px;background:var(--raise)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2);margin-bottom:8px}
.toggle b{font-weight:600}
.toggle span{display:block;font-size:12px;color:var(--muted)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line-2);position:relative;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked="true"]{background:var(--gold)}
.sw[aria-checked="true"]::after{left:21px}
.nav{display:flex;gap:10px;margin-top:20px}
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1b1608;flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--faint);margin-top:12px}
.zone-h{font:600 11px var(--font);letter-spacing:1.6px;text-transform:uppercase;margin:18px 0 8px}
.for{font:500 10px var(--mono);letter-spacing:.04em;color:var(--teal);background:var(--ai);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.opt .n{margin-left:auto;align-self:center;font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{color:var(--green);background:rgba(130,217,159,.12)}
.c-ai{color:var(--teal);background:var(--ai)}
.c-warn{color:var(--warn);background:var(--warn-soft)}
.devs{display:grid;gap:8px}
.dev{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg-2)}
.dev small{display:block;color:var(--muted);font-size:12px}
.mini{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600}
.team{display:grid;gap:8px}
.mem{display:grid;grid-template-columns:1fr 130px;gap:8px}
.cmds{display:grid;gap:8px;margin-top:6px}
.cmd{text-align:left;border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.cmd:hover{border-color:var(--teal)}
.cmd .ar{font-family:var(--ar)}
.mic{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:12px;border-radius:12px;background:var(--ai);border:1px solid rgba(92,207,181,.3)}
.mic i{width:10px;height:10px;border-radius:50%;background:var(--teal);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.steps4{display:grid;gap:6px;margin-top:12px;font-size:13px}
.steps4 div{display:flex;gap:8px;align-items:center;color:var(--faint)}
.steps4 div.on{color:var(--ink)}
.steps4 div.on b{color:var(--teal)}
.approve{margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(240,179,94,.4);background:var(--warn-soft)}
.approve[hidden]{display:none}

.stagewrap{position:relative;min-height:0}
canvas#stage{width:100%;height:100%;display:block;cursor:grab}
canvas#stage:active{cursor:grabbing}
.hud{position:absolute;left:16px;top:14px;padding:10px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(11,15,24,.82),rgba(11,15,24,.55));backdrop-filter:blur(6px);max-width:min(560px,calc(100% - 32px));pointer-events:none}
.hud .k{display:flex;align-items:center;gap:8px}
.hud .k .live{width:7px;height:7px;border-radius:50%;background:#ff6b6b;animation:pulse 1.6s infinite}
.hud h2{font-family:var(--display);font-weight:400;font-size:28px;margin:4px 0 0}
.hud p{margin:2px 0 0;color:var(--muted);font-size:13px}
.caption{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;padding:9px 16px;border-radius:12px;background:rgba(12,16,24,.8);border:1px solid var(--line);font-size:13px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.caption b{color:var(--gold-2)}
.hint{position:absolute;right:16px;bottom:18px;font-size:11.5px;color:var(--faint)}
.verified{position:absolute;right:16px;top:14px;padding:8px 12px;border-radius:12px;background:rgba(130,217,159,.14);border:1px solid rgba(130,217,159,.4);color:var(--green);font-weight:600;font-size:13px;opacity:0;transition:.3s}
.verified.show{opacity:1}
/* follow-a-fix button and the room view panel */
.follow{position:absolute;right:16px;top:14px;border:1px solid rgba(232,199,122,.5);background:rgba(232,199,122,.14);color:var(--gold-2);border-radius:12px;padding:9px 14px;font-weight:600;font-size:13px}
.follow:hover{background:rgba(232,199,122,.24)}
.follow[hidden]{display:none}
.rback{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rback:hover{color:var(--ink);border-color:var(--gold)}
.rsec{margin-top:18px}
.rsec h3{font:600 11px var(--font);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.rsec ul{margin:0;padding-left:18px;color:var(--ink);font-size:13px}
.rsec li{margin:3px 0}
.never li::marker{content:"✕  ";color:var(--bad)}
.agent{width:100%;text-align:left;display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);background:var(--bg-2);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.agent:hover{border-color:var(--teal)}
.agent[aria-expanded="true"]{border-color:var(--teal);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.agent b{flex:1}
.acard{border:1px solid var(--teal);border-top:0;border-radius:0 0 12px 12px;padding:10px 12px 12px;margin-bottom:8px;background:rgba(92,207,181,.05);font-size:13px}
.acard p{margin:0 0 8px}
.acard .lbl{display:block;font-size:11px;color:var(--muted);margin:8px 0 3px;letter-spacing:.4px}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools span{font:500 11px var(--mono);background:var(--raise);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
.st{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-working{color:var(--teal);background:var(--ai)}
.st-waiting{color:var(--warn);background:var(--warn-soft)}
.st-idle{color:var(--muted);background:var(--raise)}
.wait{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;border:1px solid rgba(240,179,94,.35);background:var(--warn-soft);border-radius:10px;margin-bottom:6px;font-size:13px}
.wait small{display:block;color:var(--muted);font-size:11.5px}
.wait.done{border-color:rgba(130,217,159,.4);background:rgba(130,217,159,.1)}
.feed{font:12px/1.6 var(--mono);color:var(--muted)}
.feed div:first-child{color:var(--ink)}
.hands{display:flex;flex-wrap:wrap;gap:6px}
.hands button{border:1px solid var(--line-2);background:var(--bg-2);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600}
.hands button:hover{border-color:var(--gold)}
.offnote{margin-top:12px;padding:10px 12px;border:1px dashed var(--line-2);border-radius:10px;font-size:13px;color:var(--muted)}
.story{margin-top:12px;padding:12px;border-radius:12px;border:1px solid rgba(232,199,122,.45);background:var(--gold-soft)}
.story .k{font-size:10.5px}
.story h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0}
.story p{margin:0 0 10px;font-size:13px}
.story .ctl{display:flex;gap:6px;flex-wrap:wrap}
.story .ctl button{border:1px solid var(--line-2);background:var(--bg-2);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600}
.story .bar{height:3px;background:var(--line-2);border-radius:2px;margin:0 0 10px;overflow:hidden}
.story .bar i{display:block;height:100%;background:var(--gold)}
.twist{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid rgba(242,125,125,.45);background:var(--bad-soft);font-size:13px}
.twist ol{margin:6px 0 8px;padding-left:18px}
</style>
<script src="rooms-data.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="word">Diwan</span><span class="tag">Create your account</span></div>
  <span class="sample">Mockup · sample data</span>
  <div class="mode" role="group" aria-label="Who is signing up">
    <button id="m-office" aria-pressed="true">Office (company)</button>
    <button id="m-user" aria-pressed="false">User (resident or staff)</button>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <div class="progress" id="progress"></div>
    <div id="panel"></div>
    <div class="nav">
      <button class="btn" id="back">Back</button>
      <button class="btn primary" id="next">Continue</button>
    </div>
  </aside>
  <div class="stagewrap">
    <canvas id="stage" aria-label="3D view"></canvas>
    <div class="hud"><div class="k"><span class="live"></span><span id="hud-k">Your office, building itself</span></div><h2 id="hud-h">Sample Properties</h2><p id="hud-p">Each room you turn on appears here, with its agents.</p></div>
    <div class="verified" id="verified">✓ Camera confirmed</div>
    <button class="follow" id="follow" title="Play the best case, room to room">▶ Follow a fix</button>
    <div class="caption" id="caption">Drag to turn the view</div>
    <div class="hint">Drag to rotate · scroll to zoom</div>
  </div>
</div>

<script>
(function(){
const $ = s => document.querySelector(s);

/* =========================================================
   Tiny 3D renderer on canvas 2D (no libraries, works offline)
   ========================================================= */
const cv = $('#stage'), ctx = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){ const r=cv.getBoundingClientRect(); DPR=Math.min(2,window.devicePixelRatio||1); W=r.width; H=r.height; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize);
const cam={yaw:0.75,pitch:0.62,zoom:1,auto:true};
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:cam.yaw,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{
  if(drag){ if(Math.abs(e.clientX-drag.x)>5) { drag.moved=true; cam.auto=false; } if(drag.moved) cam.yaw=drag.yaw+(e.clientX-drag.x)*0.008; return; }
  const p=local(e); cv.style.cursor = mode==='office' && (view==='office'?hitRoom(p):hitAgent(p))!=null ? 'pointer' : 'grab';
});
cv.addEventListener('pointerup',e=>{ const d=drag; drag=null; if(!d||d.moved||mode!=='office') return;
  const p=local(e);
  if(view==='office'){ const k=hitRoom(p); if(k) openRoom(k); }
  else { const i=hitAgent(p); if(i!=null){ RV.agent=i; renderRoomPanel(); } }
});
function local(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
function bbox(pts){ return {x0:Math.min(...pts.map(p=>p.x)),x1:Math.max(...pts.map(p=>p.x)),y0:Math.min(...pts.map(p=>p.y)),y1:Math.max(...pts.map(p=>p.y))}; }
function inBox(b,p){ return b && p.x>=b.x0 && p.x<=b.x1 && p.y>=b.y0 && p.y<=b.y1; }
function nearest(list,p){ let best=null,bd=1e9; for(const [k,b] of list){ if(!inBox(b,p)) continue; const d=Math.hypot((b.x0+b.x1)/2-p.x,(b.y0+b.y1)/2-p.y); if(d<bd){bd=d;best=k;} } return best; }
function hitRoom(p){ return nearest(ROOMS.map(r=>[r.key,r._hit]),p); }
function hitAgent(p){ return nearest((RV.hits||[]).map((b,i)=>[i,b]),p); }
cv.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.6,Math.min(1.8,cam.zoom*(e.deltaY>0?.92:1.08)));},{passive:false});

function proj(x,y,z){
  const cy_=Math.cos(cam.yaw), sy=Math.sin(cam.yaw), cp=Math.cos(cam.pitch), sp=Math.sin(cam.pitch);
  const xr=x*cy_-z*sy, zr=x*sy+z*cy_;
  const yr=y*cp-zr*sp, zd=y*sp+zr*cp;
  const s=Math.min(W,H)/(mode==='office'&&view==='office'?27:20)*cam.zoom;
  return {x:W/2+xr*s, y:H*0.58-yr*s, d:zd};
}
function hex(c){ const n=parseInt(c.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function shade(c,k,a){ const [r,g,b]=hex(c); return `rgba(${Math.round(r*k)},${Math.round(g*k)},${Math.round(b*k)},${a==null?1:a})`; }
const LIGHT=[-0.4,0.8,0.45];
let ambient=1;
function boxFaces(o){
  const {x,y,z,w,h,d,c,a,edge,glow}=o; if(h<=0.001) return [];
  const v=[[x-w/2,y,z-d/2],[x+w/2,y,z-d/2],[x+w/2,y,z+d/2],[x-w/2,y,z+d/2],[x-w/2,y+h,z-d/2],[x+w/2,y+h,z-d/2],[x+w/2,y+h,z+d/2],[x-w/2,y+h,z+d/2]];
  const F=[[4,5,6,7,[0,1,0]],[0,1,5,4,[0,0,-1]],[1,2,6,5,[1,0,0]],[2,3,7,6,[0,0,1]],[3,0,4,7,[-1,0,0]]];
  const P=v.map(p=>proj(...p));
  const cy_=Math.cos(cam.yaw), sy=Math.sin(cam.yaw);
  const out=[];
  for(const f of F){
    const n=f[4];
    // view direction test using rotated normal z
    const nzr=n[0]*sy+n[2]*cy_, nyr=n[1];
    const facing = n[1]===1 ? true : (nyr*Math.sin(cam.pitch)+nzr*Math.cos(cam.pitch))>-0.01;
    if(!facing) continue;
    const lam=Math.max(0,n[0]*LIGHT[0]+n[1]*LIGHT[1]+n[2]*LIGHT[2]);
    const k=(0.42+0.58*lam)*(glow?1:ambient)*(o.k||1);
    const pts=[P[f[0]],P[f[1]],P[f[2]],P[f[3]]];
    out.push({t:'poly',pts,d:(pts[0].d+pts[1].d+pts[2].d+pts[3].d)/4+(o.bias||0),fill:shade(c,k,a),stroke:edge||null,top:n[1]===1,o});
  }
  return out;
}
function drawItems(items){
  items.sort((a,b)=>a.d-b.d);
  for(const it of items){
    if(it.t==='poly'){
      ctx.beginPath(); ctx.moveTo(it.pts[0].x,it.pts[0].y); for(let i=1;i<4;i++) ctx.lineTo(it.pts[i].x,it.pts[i].y); ctx.closePath();
      ctx.fillStyle=it.fill; ctx.fill();
      if(it.stroke){ ctx.strokeStyle=it.stroke; ctx.lineWidth=1; ctx.stroke(); }
      if(it.top && it.o.screenText){ const c=centroid(it.pts); ctx.fillStyle=it.o.screenColor||'#fff'; ctx.font='600 11px Inter, sans-serif'; ctx.textAlign='center'; ctx.fillText(it.o.screenText,c.x,c.y+4); }
      if(it.o.faceText && !it.top && it.o.faceTextSide===it.side){}
    } else if(it.t==='dot'){
      ctx.beginPath(); ctx.arc(it.p.x,it.p.y,it.r,0,Math.PI*2); ctx.fillStyle=it.c; ctx.fill();
      if(it.glow){ ctx.beginPath(); ctx.arc(it.p.x,it.p.y,it.r*2.4,0,Math.PI*2); ctx.fillStyle=it.glow; ctx.fill(); }
    } else if(it.t==='label'){
      ctx.font=it.f||'600 12px Inter, sans-serif'; ctx.textAlign='center';
      const w=ctx.measureText(it.s).width+14;
      ctx.fillStyle='rgba(10,13,19,.78)'; roundRect(it.p.x-w/2,it.p.y-15,w,20,6); ctx.fill();
      ctx.strokeStyle=it.c||'rgba(232,199,122,.6)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle=it.tc||'#ece8df'; ctx.fillText(it.s,it.p.x,it.p.y-1);
    } else if(it.t==='line'){
      ctx.beginPath(); ctx.moveTo(it.a.x,it.a.y); ctx.lineTo(it.b.x,it.b.y); ctx.strokeStyle=it.c; ctx.lineWidth=it.w||1; if(it.dash) ctx.setLineDash(it.dash); ctx.stroke(); ctx.setLineDash([]);
    } else if(it.t==='face'){ // a vertical quad with text, for screens
      ctx.beginPath(); ctx.moveTo(it.pts[0].x,it.pts[0].y); for(let i=1;i<4;i++) ctx.lineTo(it.pts[i].x,it.pts[i].y); ctx.closePath();
      ctx.fillStyle=it.fill; ctx.fill(); ctx.strokeStyle=it.stroke; ctx.stroke();
      if(it.lines){ const c=centroid(it.pts); ctx.textAlign='center'; it.lines.forEach((l,i)=>{ ctx.font=l[1]; ctx.fillStyle=l[2]; ctx.fillText(l[0],c.x,c.y-10+i*16); }); }
    }
  }
}
function centroid(p){ return {x:(p[0].x+p[1].x+p[2].x+p[3].x)/4, y:(p[0].y+p[1].y+p[2].y+p[3].y)/4}; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
const ease=(a,b,t)=>a+(b-a)*Math.min(1,t);

function officeItems(time){

    ${ZONES.map(zn=>`<div class="zone-h" style="color:${zn.c}">${zn.name}</div>`+ROOMS.filter(r=>r.zone===zn.key).map(r=>`<div class="toggle"><div><b>${r.name}${S.type&&PRESETS[S.type].includes(r.key)?'<span class="for">for you</span>':''}</b><span>${r.desc}</span></div><button class="sw" role="switch" data-room="${r.key}" aria-checked="${!!S.rooms[r.key]}" aria-label="${r.name}"></button></div>`).join('')).join('')}`,
  ()=>`<div class="k">Step 4 of 5</div><h1>Invite your team</h1><p class="sub">Everyone sees only what their role allows.</p>
    <div class="team">${S.team.map(([n,r])=>`<div class="mem"><input value="${n}"><select>${['Owner','Broker','Compliance','Finance','Engineer','Marketing'].map(o=>`<option ${o===r?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</div>
    <button class="mini" id="add-mem" style="margin-top:10px">+ Add person</button>
    <p class="note">Compliance reasons stay visible to Compliance only.</p>`,
  ()=>`<div class="k">Step 5 of 5</div><h1>Connect and agree</h1><p class="sub">You can change these later in Settings.</p>
    <div class="toggle"><div><b>WhatsApp Business</b><span>Rania answers new clients from your listings</span></div><button class="sw" role="switch" data-flag="wa" aria-checked="${S.wa}"></button></div>
    <div class="toggle"><div><b>Ask before recording meetings</b><span>Every meeting starts with the client's consent</span></div><button class="sw" role="switch" data-flag="consent" aria-checked="${S.consent}"></button></div>
    <div class="toggle"><div><b>Keep data in the UAE</b><span>Recordings and records stored in-country</span></div><button class="sw" role="switch" data-flag="uae" aria-checked="${S.uae}"></button></div>
    <div class="toggle"><div><b>People approve money, signatures and filings</b><span>Agents can never pay, sign or submit on their own</span></div><span class="chip c-ok">Always on</span></div>`,
  ()=>`<div class="k">Ready</div><h1>Your office is open</h1><p class="sub">${Object.values(S.rooms).filter(Boolean).length} rooms, ${S.team.length} people. Agents start with today's WhatsApp messages and your listings.</p>
    <div class="steps4"><div class="on"><b>✓</b> Rooms built</div><div class="on"><b>✓</b> Team invited</div><div class="on"><b>✓</b> Consent and data rules set</div><div class="on"><b>→</b> Next: connect a meeting room in User mode</div></div>
    <p class="note">In the real product this opens office3d.html, the live 3D office you already have.</p>`
];
const USER_STEPS=[
  ()=>`<div class="k">Step 1 of 4</div><h1>Join your building or office</h1><p class="sub">Your property manager or company sends you an invite code.</p>
    <label>Invite code</label><input id="f-code" value="ALNOOR-504">
    <div class="opts" style="margin-top:12px"><div class="opt" aria-pressed="true"><span class="ic">🏠</span><span><b>Al Noor Residence · Flat 504</b><span>Managed by Sample Properties (sample)</span></span></div></div>
    <p class="note">The building pays for this; residents and staff use it free.</p>`,
  ()=>`<div class="k">Step 2 of 4</div><h1>Language and voice</h1><p class="sub">Speak in Arabic, English or both in one sentence.</p>
    <label>Language</label><select id="f-lang"><option>English and Arabic</option><option>English</option><option>العربية</option></select>
    <div class="toggle" style="margin-top:12px"><div><b>Learn my voice</b><span>So the assistant only acts on you, not on anyone else in the room</span></div><button class="sw" role="switch" data-flag="voice" aria-checked="${S.voice}"></button></div>
    ${S.voice?`<div class="mic"><i></i><span>Say: <b>“Diwan, turn on the screen”</b> · 2 of 3 samples</span></div>`:''}`,
  ()=>`<div class="k">Step 3 of 4</div><h1>Point at your devices</h1><p class="sub">Point your phone at each device. Diwan finds how to control it, tests it, and the camera checks it worked.</p>
    <div class="devs">${[['tv','Screen','Infrared code found · Samsung (sample)'],['ac','Air conditioner','Wi-Fi unit found'],['lights','Ceiling lights','Smart switch found']].map(([k,n,s])=>`<div class="dev"><div><b>${n}</b><small>${s}</small></div><span class="chip ${S.devs[k]==='ok'?'c-ok':'c-ai'}">${S.devs[k]==='ok'?'Tested ✓':'Found'}</span><button class="mini" data-test="${k}" ${S.devs[k]==='ok'?'disabled':''}>Test</button></div>`).join('')}</div>
    <p class="note">Nothing physical changes without your OK the first time.</p>`,
  ()=>`<div class="k">Step 4 of 4 · Try it</div><h1>Just say it</h1><p class="sub">Tap a command, as if you said it out loud.</p>
    <div class="cmds">
      <button class="cmd" data-cmd="slides">🎙 “Open the Al Noor project slides”</button>
      <button class="cmd" data-cmd="cool">🎙 “Make it cooler, 22 degrees”</button>
      <button class="cmd" data-cmd="dim">🎙 “Lights to 30 percent”</button>
      <button class="cmd" data-cmd="ar"><span>🎙</span><span class="ar">“شغّل الشاشة”</span><span class="muted" style="font-size:12px;color:var(--muted)">(turn on the screen)</span></button>
      <button class="cmd" data-cmd="send">🎙 “Send the safety report to the client”</button>
    </div>
    <div class="steps4" id="flow"></div>
    <div class="approve" id="approve" hidden><b>Needs your approval</b><div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Send “Al Noor Law 3 report.pdf” to client Karim H. (sample) by email?</div><button class="btn primary" id="ok-send" style="width:100%">Approve and send</button></div>`
];

function applyType(t){ S.type=t; S.rooms=Object.fromEntries(ROOMS.map(r=>[r.key,PRESETS[t].includes(r.key)])); }
function roomCount(){ return Object.values(S.rooms).filter(Boolean).length; }

let step=0;
function steps(){ return mode==='office'?OFFICE_STEPS:USER_STEPS; }
function render(){
  const st=steps(); step=Math.max(0,Math.min(step,st.length-1));
  $('#panel').innerHTML=st[step]();
  $('#progress').innerHTML=st.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('');
  $('#back').disabled=step===0;
  const last=step===st.length-1;
  $('#next').textContent= last ? (mode==='office'?'Open my office':'Done') : 'Continue';
  $('#next').disabled = mode==='office' && step===0 && !S.type;
  bind();
  syncScene();
}
function bind(){
  document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{ applyType(b.dataset.type); render();
    caption(`<b>${roomCount()} rooms</b> set up for a ${TYPE_NAME[S.type]} office · faint tiles are rooms you can add later`); });
  document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{ const k=b.dataset.room; S.rooms[k]=!S.rooms[k]; b.setAttribute('aria-checked',S.rooms[k]); const rc=$('#rc'); if(rc) rc.textContent=roomCount(); syncScene(); caption(S.rooms[k]?`<b>${ROOMS.find(r=>r.key===k).name}</b> added · its agents start walking to the shared record`:`${ROOMS.find(r=>r.key===k).name} removed`); });
  document.querySelectorAll('[data-flag]').forEach(b=>b.onclick=()=>{ const k=b.dataset.flag; S[k]=!S[k]; render(); });
  const fc=$('#f-company'); if(fc) fc.oninput=()=>{ S.company=fc.value; $('#hud-h').textContent=fc.value||'Your office'; };
  const am=$('#add-mem'); if(am) am.onclick=()=>{ S.team.push(['New person','Broker']); render(); };
  document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{ const k=b.dataset.test; S.devs[k]='ok';
    if(k==='tv'){ U.screenText=['Test picture','Screen responds']; setTimeout(()=>U.screenText=null,1800); }
    if(k==='ac'){ U.ac=1; setTimeout(()=>U.ac=0,1800); }
    if(k==='lights'){ U.lightTarget=.4; setTimeout(()=>U.lightTarget=1,1200); }
    U.verify=1; flashVerified(); caption(`<b>Tested.</b> Command sent, and the room camera saw it work`); render(); });
  document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>runCmd(b.dataset.cmd));
  const ok=$('#ok-send'); if(ok) ok.onclick=()=>{ $('#approve').hidden=true; U.sent=true; showFlow(['Heard','Found the signed report','Approved by you','Sent · logged in Records'],4); caption('<b>Sent</b> after your approval · logged in Records'); };
}
function caption(h){ $('#caption').innerHTML=h; }
function flashVerified(){ const v=$('#verified'); v.classList.add('show'); clearTimeout(v._t); v._t=setTimeout(()=>v.classList.remove('show'),2400); }
function showFlow(labels,n){
  $('#flow').innerHTML=labels.map((l,i)=>`<div class="${i<n?'on':''}"><b>${i<n?'✓':'·'}</b> ${l}</div>`).join('');
}
function runCmd(c){
  $('#approve').hidden=true;
  const say={slides:'Open the Al Noor project slides',cool:'Make it cooler, 22 degrees',dim:'Lights to 30 percent',ar:'شغّل الشاشة',send:'Send the safety report to the client'}[c];
  U.say='“'+say+'”'; U.talk=1.6;
  const labels={slides:['Heard you (voice matched)','Found “Al Noor · Law 3 report” in Diwan','Screen on, deck opened at slide 1','Room camera confirmed the slide is showing'],
    cool:['Heard you (voice matched)','Air conditioner found','Set to 22°','Display reads 22°, confirmed'],
    dim:['Heard you (voice matched)','Ceiling lights found','Set to 30%','Camera saw the room dim'],
    ar:['سمعتك (Arabic understood)','Screen found','Screen on','Camera confirmed'],
    send:['Heard you (voice matched)','Found the signed report','Waiting for your approval','—']}[c];
  showFlow(labels,1);
  let i=1; const tick=setInterval(()=>{ i++; showFlow(labels, c==='send'?Math.min(i,2):i);
    if(i===3){
      if(c==='slides'){ U.screenText=['Al Noor Residence · Law 3 report','Slide 1 of 12 · signed 14 Nov 2026']; }
      if(c==='ar'){ U.screenText=['الشاشة تعمل','Screen on']; }
      if(c==='cool'){ U.ac=1; U.acSet=22; }
      if(c==='dim'){ U.lightTarget=.3; }
      if(c==='send'){ $('#approve').hidden=false; caption('<b>Sensitive action:</b> sending a file needs your tap'); }
    }
    if(i>=4){ clearInterval(tick); if(c!=='send'){ U.verify=1; flashVerified(); caption(`<b>Done and checked.</b> ${labels[3]}`); } }
  },650);
}
function syncScene(){
  if(mode==='office'){
    ROOMS.forEach(r=>r.on=!!S.rooms[r.key]);
    $('#hud-k').textContent='Your office, building itself';
    $('#hud-h').textContent=S.company||'Your office';
    $('#hud-p').textContent= step>=5 ? 'Open. Agents are moving work between rooms through one shared record.'
      : S.type ? `${roomCount()} rooms lit across five areas. Faint tiles are rooms you can add later.`
      : 'Five areas around one shared record. Pick your office type and its rooms light up.';
  } else {
    $('#hud-k').textContent='Your space, controlled by voice';
    $('#hud-h').textContent= step===0?'Al Noor Residence · Flat 504':'Meeting room or home';
    $('#hud-p').textContent='Say it in Arabic or English. Diwan acts, then the room camera checks it really happened.';
  }
}
function setMode(m){
  if(view==='room'){ stopStory(); clearInterval(feedTimer); view='office'; RV.room=null; $('#progress').style.display=''; document.querySelector('.nav').style.display=''; }
  $('#follow').hidden = m!=='office';
  mode=m; step=0; cam.auto=true; cam.yaw=m==='office'?0.75:0.55;
  $('#m-office').setAttribute('aria-pressed',m==='office'); $('#m-user').setAttribute('aria-pressed',m==='user');
  caption(m==='office'?'Pick your office type to start':'Join with the code your building or company sent you');
  render();
}
/* =========================================================
   Room view: open a room, its panel, and "Follow a fix"
   ========================================================= */
const roomName=k=>ROOMS.find(r=>r.key===k).name;
function hhmm(){ return new Date().toTimeString().slice(0,5); }
let feedTimer=null, storyTimer=null;
function openRoom(k, keepStory){
  if(!RD[k]) return;
  if(!keepStory) stopStory();
  view='room'; RV.room=k; RV.agent=(RV.story>=0?STORY[RV.story].agent:0); RV.papers=[]; RV.twist=false;
  RV.feed=RD[k].feed.slice().reverse();
  cam.auto=false; cam.yaw=0.5; cam.pitch=0.62; cam.zoom=1;
  $('#progress').style.display='none'; document.querySelector('.nav').style.display='none';
  $('#follow').hidden=true;
  const r=ROOMS.find(x=>x.key===k);
  $('#hud-k').textContent=ZONE[r.zone].name+' · inside the room';
  $('#hud-h').textContent=r.name;
  $('#hud-p').textContent=roomIsOn(k)?`${RD[k].agents.length} agent${RD[k].agents.length>1?'s':''} at work · papers show work coming in and going out`:'This room is off for your office. You can turn it on.';
  caption('Click an agent to see its card · Esc goes back to the office');
  renderRoomPanel();
  clearInterval(feedTimer); feedTimer=setInterval(tickFeed,3200);
}
function closeRoom(){
  stopStory(); clearInterval(feedTimer);
  view='office'; RV.room=null; cam.auto=true; cam.yaw=0.75; cam.zoom=1;
  $('#progress').style.display=''; document.querySelector('.nav').style.display='';
  render(); caption('Click any room to go inside · ▶ Follow a fix plays the best case');
}
function tickFeed(){
  if(view!=='room' || !roomIsOn(RV.room)) return;
  const det=RD[RV.room], a=det.agents[Math.floor(Math.random()*det.agents.length)];
  RV.feed.unshift(`${hhmm()} ${a.name}: ${a.last[Math.floor(Math.random()*a.last.length)]}`);
  RV.feed=RV.feed.slice(0,6);
  const f=$('#r-feed'); if(f) f.innerHTML=RV.feed.map(l=>`<div>${l}</div>`).join('');
}
function renderRoomPanel(){
  const k=RV.room, det=RD[k], r=ROOMS.find(x=>x.key===k), zn=ZONE[r.zone], on=roomIsOn(k);
  const st=RV.story>=0?STORY[RV.story]:null;
  $('#panel').innerHTML=`
    <button class="rback" id="r-back">← Back to the office</button>
    <div class="k" style="margin-top:16px;color:${zn.c}">${zn.name}</div><h1>${r.name}</h1>
    <p class="sub">${r.desc}.</p>
    ${st?`<div class="story"><div class="k">Follow a fix · step ${RV.story+1} of ${STORY.length}</div>
      <h2>${st.title}</h2><div class="bar"><i style="width:${Math.round(100*(RV.story+1)/STORY.length)}%"></i></div><p>${st.text}</p>
      <div class="ctl"><button id="s-prev" ${RV.story===0?'disabled':''}>◀ Back</button><button id="s-play">${RV.playing?'⏸ Pause':'▶ Play'}</button>
      <button id="s-next">${RV.story===STORY.length-1?'Finish':'Next ▶'}</button><button id="s-end">✕ End</button></div>
      ${st.twist?`<div style="margin-top:10px"><button class="rback" id="s-twist">What if the bank details change?</button></div>`:''}
      ${RV.twist?`<div class="twist"><b>Not the best case: the contractor changes bank details</b><ol>
        <li>The bank account is a pinned fact of this payment, so the payment approval is <b>cancelled by itself</b>.</li>
        <li>Compliance is alerted first; Finance shows “Stopped: bank details changed”.</li>
        <li>The compliance officer verifies the new account by phone.</li>
        <li>Only then is the owner asked to approve again, now pinned to the new account.</li></ol>
        <button class="rback" id="s-untwist">Back to the best case</button></div>`:''}
    </div>`:''}
    ${on?'':`<div class="offnote">This room is off for your office type. <button class="rback" id="r-on" style="margin-left:6px">Turn on this room</button></div>`}
    <div class="rsec"><h3>Starts when</h3><ul>${det.starts.map(s=>`<li>${s}</li>`).join('')}</ul></div>
    <div class="rsec"><h3>Agents</h3>${det.agents.map((a,i)=>{ const {now,status}=agentNow(i), open=RV.agent===i;
      return `<button class="agent" data-agent="${i}" aria-expanded="${open}"><b>${a.name}</b><span class="st st-${on?status:'idle'}">${on?status:'off'}</span></button>`+
      (open?`<div class="acard"><p>${a.does}</p><span class="lbl">NOW</span><p>${now}</p>
        <span class="lbl">TOOLS</span><div class="tools">${a.tools.map(t=>`<span>${t}</span>`).join('')}</div>
        <span class="lbl">A PERSON DECIDES</span><p>${a.decides}</p>
        <span class="lbl">RECENT</span><ul style="margin:0;padding-left:18px">${a.last.map(l=>`<li>${l}</li>`).join('')}</ul></div>`:''); }).join('')}</div>
    <div class="rsec"><h3>Waiting for you</h3>${det.waiting.length?det.waiting.map((w,i)=>{ const d=RV.done[k+i];
      return `<div class="wait ${d?'done':''}"><div>${w.t}<small>${d?'Approved by you · logged in Records':'Needs: '+w.who}</small></div>${d?'<span class="st st-working">done</span>':`<button class="mini" data-ok="${i}">Approve</button>`}</div>`; }).join(''):'<p class="note" style="margin:0">Nothing here needs a person right now.</p>'}</div>
    <div class="rsec"><h3>Work feed</h3><div class="feed" id="r-feed">${RV.feed.map(l=>`<div>${l}</div>`).join('')}</div></div>
    <div class="rsec never"><h3>Never</h3><ul>${det.never.map(n=>`<li>${n}</li>`).join('')}</ul></div>
    <div class="rsec"><h3>Hands to</h3><div class="hands">${det.hands.map(h=>`<button data-go="${h}">${roomName(h)} →</button>`).join('')}</div></div>`;
  $('#r-back').onclick=closeRoom;
  document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{ RV.agent=+b.dataset.agent; renderRoomPanel(); });
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{ RV.done[k+b.dataset.ok]=true; RV.feed.unshift(`${hhmm()} Approved by you: ${det.waiting[+b.dataset.ok].t}`); renderRoomPanel(); });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openRoom(b.dataset.go));
  const ro=$('#r-on'); if(ro) ro.onclick=()=>{ S.rooms[k]=true; openRoom(k); };
  if(st){
    $('#s-prev').onclick=()=>goStory(RV.story-1);
    $('#s-next').onclick=()=>{ if(RV.story===STORY.length-1){ stopStory(); renderRoomPanel(); caption('<b>Best case complete.</b> Every step is in Records'); } else goStory(RV.story+1); };
    $('#s-play').onclick=()=>{ RV.playing=!RV.playing; armStory(); renderRoomPanel(); };
    $('#s-end').onclick=closeRoom;
    const tw=$('#s-twist'); if(tw) tw.onclick=()=>{ RV.twist=true; RV.playing=false; armStory(); renderRoomPanel(); };
    const ut=$('#s-untwist'); if(ut) ut.onclick=()=>{ RV.twist=false; renderRoomPanel(); };
  }
}
function goStory(i){
  RV.story=Math.max(0,Math.min(STORY.length-1,i));
  openRoom(STORY[RV.story].room, true);
  caption(`<b>Step ${RV.story+1} of ${STORY.length}:</b> ${STORY[RV.story].title}`);
  armStory();
}
function armStory(){ clearTimeout(storyTimer); if(RV.playing && RV.story>=0 && RV.story<STORY.length-1) storyTimer=setTimeout(()=>goStory(RV.story+1),5500); }
function startStory(at){ if(!S.type) applyType('eng'); RV.playing=true; goStory(at||0); }
function stopStory(){ clearTimeout(storyTimer); RV.story=-1; RV.playing=false; RV.twist=false; }
$('#follow').onclick=()=>startStory(0);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && view==='room') closeRoom(); });

$('#m-office').onclick=()=>setMode('office');
$('#m-user').onclick=()=>setMode('user');
$('#next').onclick=()=>{ const st=steps(); if(step<st.length-1){ step++; render(); if(mode==='office'&&step===5) caption('<b>Your office is open.</b> Agents start work.'); } else { caption(mode==='office'?'This is where office3d.html would open':'All set · your devices answer to your voice'); } };
$('#back').onclick=()=>{ step--; render(); };

// Direct links for demos: #eng picks the office type; #eng/room=site opens a room; #eng/story=5 opens the story at step 5
const [pick,extra='']=location.hash.slice(1).split('/'); if(PRESETS[pick]) applyType(pick);
resize(); render(); requestAnimationFrame(frame);
if(S.type) caption('Click any room to go inside · ▶ Follow a fix plays the best case');
const [ek,ev]=extra.split('=');
if(ek==='room' && RD[ev]) openRoom(ev);
if(ek==='story'){ startStory((+ev||1)-1); RV.playing=false; armStory(); renderRoomPanel(); }
})();
</script>
</body>
</html>
